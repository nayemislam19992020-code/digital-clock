
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>Digital Clock</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

    <div class="w-full min-h-screen grid place-items-center p-4">

        <div class="w-full max-w-2xl border border-gray-200
                    bg-white p-6 rounded-xl shadow-xl">

            <!-- Time -->
            <div class="text-4xl font-bold text-center
                        text-blue-600" id="time">
                09:15:10
            </div>

            <!-- Date -->
            <div class="text-center my-5 italic
                        font-bold text-gray-600" id="date">
                Aug/08/2026
            </div>

            <!-- Days -->
            <ul class="grid grid-cols-7 gap-2
                       *:border *:border-gray-200
                       *:px-2 *:py-3
                       *:text-center *:rounded-lg
                       *:shadow-md *:shadow-gray-200
                       *:cursor-pointer
                       *:text-xs sm:*:text-sm
                       *:hover:bg-blue-500
                       *:hover:text-white
                       *:transition-all
                       *:duration-300" id="day">

                <li>Sat</li>
                <li>Sun</li>
                <li>Mon</li>
                <li>Tue</li>
                <li>Wed</li>
                <li>Thu</li>
                <li>Fri</li>

            </ul>

        </div>

    </div>
   <script src="./script.js"></script>
</body>
</html>
